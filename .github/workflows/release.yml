name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full verification before publishing — tests, lints, and audit
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Run tests
        run: cargo test --workspace --all-features --release
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Install cargo-audit
        # Pinned: see ci.yml security-tools install rationale.
        uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # main
        with:
          tool: cargo-audit@0.22.1
      - name: Security audit
        # The single source of truth is `.cargo/audit.toml` (mirrored
        # by `deny.toml`); cargo-audit auto-discovers it. No CLI flags.
        run: cargo audit --deny warnings

  # Publish to crates.io
  publish:
    name: Publish
    # `cargo publish` is irreversible — crates.io has no un-publish (only
    # yank, which still leaves the version downloadable). Gate it behind
    # EVERY fallible job (build artifacts, SBOM, Sigstore signing, SLSA
    # provenance), not just `verify`. A late failure — e.g. Sigstore —
    # then blocks the publish entirely, leaving a clean "nothing shipped,
    # fix and re-tag" state instead of a published crate beside a red run.
    needs: [verify, build-artifacts, sbom, sign-artifacts, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      # Single crate publish (all sub-crates consolidated into latticearc).
      # Tolerate "already uploaded/exists" so workflow re-runs don't fail.
      #
      # Capture cargo's exit code in a dedicated variable BEFORE
      # matching on the output, so a real failure (network drop, auth,
      # etc.) whose stderr happens to contain the substring "already
      # exists" cannot be silently treated as a successful idempotent
      # re-run. The previous shape used `OUTPUT=$(...) && exit 0`
      # followed by a substring grep — fine on success, but fragile
      # because the grep ran on output text without checking whether
      # cargo actually exited cleanly.
      - name: Publish latticearc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Override GitHub's default `bash --noprofile --norc -eo pipefail`
        # shell with `bash {0}` (no `-e`). The script below captures cargo's
        # exit code explicitly into `PUBLISH_EXIT` and routes "already
        # uploaded" to a tolerated-warning branch. With `-e` on, the
        # `OUTPUT=$(cargo publish ...)` command substitution aborts the
        # whole script when cargo exits non-zero — BEFORE the tolerance
        # check ever runs — which is what failed run 27053313529: v0.9.1
        # was published manually at 05:04:30Z, the workflow's later
        # cargo publish hit "already uploaded" 56 minutes after, and the
        # tolerance branch was unreachable. `set -uo pipefail` below
        # re-enables `-u` and pipefail explicitly.
        shell: bash --noprofile --norc {0}
        run: |
          set -uo pipefail
          OUTPUT=$(cargo publish -p latticearc --token "$CARGO_REGISTRY_TOKEN" 2>&1)
          PUBLISH_EXIT=$?
          echo "$OUTPUT"
          if [ "$PUBLISH_EXIT" -eq 0 ]; then
            echo "::notice::Crate published successfully"
            exit 0
          fi
          # Non-zero exit. The only tolerated failure is "version already
          # published" on a workflow re-run.
          if echo "$OUTPUT" | grep -qE "already (uploaded|exists)"; then
            echo "::warning::Crate version already published — skipping"
            exit 0
          fi
          echo "::error::cargo publish failed with exit $PUBLISH_EXIT"
          exit "$PUBLISH_EXIT"

  # Create GitHub release
  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the K-a-C summary for this version (everything from
          # `## [VERSION]` up to the next `## [` heading OR the
          # `### Audit rounds & hardening` divider, whichever comes
          # first). VERSION is bound via env: above so the value is
          # shell-expanded at runtime; inlining a workflow expression
          # directly into a sed argument would let a malicious tag inject
          # shell metacharacters.
          #
          # Why bounded at "Audit rounds & hardening": large releases
          # may include hundreds of per-round detail sub-sections
          # totalling >250KB. GitHub Releases API caps body at 125KB,
          # and `action-gh-release` spawns a subprocess whose argv
          # blows past ARG_MAX before the API cap is even checked.
          # Per-round detail lives in the repo CHANGELOG; the release
          # page links there.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1 }
            found && /^### Audit rounds & hardening/ { exit }
            found && $0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]" { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-body.md"

          # Append a pointer to the full CHANGELOG if the version section
          # had an audit-rounds tail that we truncated.
          if grep -q "^### Audit rounds & hardening" CHANGELOG.md; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**Per-round detail** in the [full CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md) under \"Audit rounds & hardening\"."
            } >> "$RUNNER_TEMP/release-body.md"
          fi

          echo "body_path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
          echo "body_bytes=$(wc -c < "$RUNNER_TEMP/release-body.md")" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  # Generate SBOM
  sbom:
    name: SBOM Generation
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      sbom-hash: ${{ steps.hash.outputs.sbom-hash }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install SBOM tools
        # Pin SBOM generator versions so the signed SBOM we ship has
        # reproducible structure / component shape across release days.
        # Uses taiki-e/install-action (prebuilt binaries) to match the
        # security-tool install pattern. Fail-fast on install error is
        # the correct semantic now that the downstream sign step refuses
        # placeholder SBOMs: a tool-install failure should abort the
        # release here rather than continue and fail at signing.
        uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # main
        with:
          tool: cargo-sbom@0.10.0,cargo-cyclonedx@0.5.9
      - name: Generate SBOM (SPDX)
        run: cargo sbom > sbom.spdx.json || echo '{}' > sbom.spdx.json
        continue-on-error: true
      - name: Generate SBOM (CycloneDX)
        run: |
          # cargo-cyclonedx 0.5.9 with `--all` writes one SBOM per
          # workspace member at `<member-dir>/<crate-name>.cdx.<fmt>`,
          # NOT a single `bom.json` at the workspace root (the earlier
          # comment claiming `bom.json/bom.xml` was correct for an
          # older cargo-cyclonedx; the file layout changed by 0.5.x).
          # The v0.8.3 release failed at the strict-SBOM-signing gate
          # because this step silently fell through to its
          # `echo '{}' > sbom.cdx.json` fallback when `mv bom.json` could
          # not find a file. We collect the SBOM for the **published**
          # crate (latticearc) — its dep graph is what crates.io consumers
          # care about; latticearc-cli and the test crate are not
          # published and their per-crate SBOMs are not exposed via the
          # release artifact.
          #
          # Explicit if/then/else (not `A && B || C`) because the latter
          # parses as `(A && B) || C` — a successful generate followed by
          # a failed mv would overwrite the just-generated SBOM with the
          # empty fallback, exactly the bug this step is recovering from.
          # cargo-cyclonedx 0.5.9 does not honor a `-p <pkg>` selector
          # (verified locally: `cargo cyclonedx -p latticearc` exits 2
          # with "Usage"). It always walks the entire workspace and
          # emits one SBOM per member. Generate once per format and
          # pick up the published crate's file.
          SBOM_JSON_SRC="latticearc/latticearc.cdx.json"
          SBOM_XML_SRC="latticearc/latticearc.cdx.xml"
          if cargo cyclonedx --format json; then
            if [ -f "$SBOM_JSON_SRC" ]; then
              mv -f "$SBOM_JSON_SRC" sbom.cdx.json
            else
              echo "ERROR: cargo cyclonedx --format json exited 0 but $SBOM_JSON_SRC missing" >&2
              echo '{}' > sbom.cdx.json
            fi
          else
            echo '{}' > sbom.cdx.json
          fi
          if cargo cyclonedx --format xml; then
            if [ -f "$SBOM_XML_SRC" ]; then
              mv -f "$SBOM_XML_SRC" sbom.cdx.xml
            else
              echo "ERROR: cargo cyclonedx --format xml exited 0 but $SBOM_XML_SRC missing" >&2
              echo '<bom/>' > sbom.cdx.xml
            fi
          else
            echo '<bom/>' > sbom.cdx.xml
          fi
        continue-on-error: true
      - name: Generate hash
        id: hash
        run: |
          sha256sum sbom.cdx.json sbom.spdx.json > sbom-checksums.txt
          echo "sbom-hash=$(sha256sum sbom.cdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json
            sbom.cdx.xml
            sbom-checksums.txt

  # Build artifacts for provenance
  build-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cli_binary: latticearc-cli
          - target: x86_64-apple-darwin
            os: macos-15-intel
            cli_binary: latticearc-cli
          - target: aarch64-apple-darwin
            os: macos-latest
            cli_binary: latticearc-cli
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2

      # Go is required for aws-lc-fips-sys FIPS builds
      - name: Install Go (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: 'stable'
          cache: false

      - name: Build release
        run: cargo build --workspace --release --target ${{ matrix.target }} --all-features

      - name: Verify CLI binary
        run: |
          CLI_BIN="target/${{ matrix.target }}/release/${{ matrix.cli_binary }}"
          if [ -f "$CLI_BIN" ]; then
            echo "CLI binary found: $CLI_BIN ($(wc -c < "$CLI_BIN") bytes)"
            "$CLI_BIN" info || true
          else
            echo "Warning: CLI binary not found at $CLI_BIN"
          fi
        shell: bash

      - name: Generate checksums
        id: hash
        run: |
          cd target/${{ matrix.target }}/release
          # Include both library and CLI binary in checksums. The SLSA
          # provenance generator (later step) consumes `hashes=` as
          # `base64-subjects`; an empty value silently produces a
          # no-subject attestation that signs nothing. Fail fast here
          # if there's nothing to hash so a misconfigured build path
          # (renamed library, missing CLI binary, target-triple typo)
          # can't quietly publish an attestation that provides no
          # provenance.
          HASH_FILES=""
          for f in liblatticearc* ${{ matrix.cli_binary }}; do
            [ -f "$f" ] && HASH_FILES="$HASH_FILES $f"
          done
          if [ -z "$HASH_FILES" ]; then
            echo "::error::No build artifacts found for hashing (target=${{ matrix.target }})." >&2
            echo "::error::Expected liblatticearc* and ${{ matrix.cli_binary }} in target/${{ matrix.target }}/release/." >&2
            ls -la . >&2 || true
            exit 1
          fi
          sha256sum $HASH_FILES | tee checksums.txt
          HASHES_B64=$(sha256sum $HASH_FILES | base64 -w0)
          if [ -z "$HASHES_B64" ]; then
            echo "::error::sha256sum produced empty output; would yield no-subject SLSA attestation." >&2
            exit 1
          fi
          echo "hashes=$HASHES_B64" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          TARGET="${{ matrix.target }}"
          VERSION="${GITHUB_REF#refs/tags/v}"
          cd target/${{ matrix.target }}/release

          # Package library artifacts
          for f in liblatticearc*; do
            [ -f "$f" ] && cp "$f" ../../../artifacts/"${f%.*}-${TARGET}.${f##*.}" 2>/dev/null || true
          done

          # Package CLI binary as tarball
          CLI_BIN="${{ matrix.cli_binary }}"
          if [ -f "$CLI_BIN" ]; then
            cd ../../..
            mkdir -p "latticearc-${VERSION}-${TARGET}"
            cp "target/${TARGET}/release/${CLI_BIN}" "latticearc-${VERSION}-${TARGET}/"
            cp latticearc-cli/README.md "latticearc-${VERSION}-${TARGET}/" 2>/dev/null || true
            cp latticearc-cli/QUICK_REFERENCE.md "latticearc-${VERSION}-${TARGET}/" 2>/dev/null || true
            tar czf "artifacts/latticearc-${VERSION}-${TARGET}.tar.gz" "latticearc-${VERSION}-${TARGET}"
            rm -rf "latticearc-${VERSION}-${TARGET}"
          fi

          [ -f "target/${TARGET}/release/checksums.txt" ] && cp "target/${TARGET}/release/checksums.txt" "artifacts/checksums-${TARGET}.txt" 2>/dev/null || true
        shell: bash
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latticearc-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: warn

  # SLSA Level 3 Provenance
  provenance:
    name: SLSA Provenance
    needs: [build-artifacts]
    permissions:
      actions: read
      id-token: write
      contents: write
    # NOTE: SLSA reusable workflows require tag refs, not commit SHAs.
    # See: https://github.com/slsa-framework/slsa-github-generator/blob/main/SPECIFICATIONS.md
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build-artifacts.outputs.hashes }}"
      upload-assets: true

  # Sign artifacts with Sigstore Cosign
  sign-artifacts:
    name: Sign with Sigstore
    needs: [build-artifacts, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Sign artifacts with Cosign (keyless)
        run: |
          echo "Signing artifacts with Sigstore Cosign..."

          # Sign library artifacts
          # sign-or-fail. Previously this step
          # had three layers of failure-swallowing — `2>/dev/null`,
          # `|| echo "Warning..."`, and `continue-on-error: true` —
          # which let releases ship unsigned. cosign exit codes now
          # propagate; `set -e` aborts on the first failure; the
          # outer `continue-on-error` is dropped; the upload step
          # demands `if-no-files-found: error`.
          set -e
          # No `--oidc-issuer`: cosign auto-detects the GitHub Actions
          # ambient OIDC issuer. Since cosign v2.6 the bundled signing
          # config is active by default, and passing an explicit issuer
          # URL alongside it fails with "cannot specify service URLs and
          # use signing config". `--bundle` writes the new-format Sigstore
          # bundle (signature + certificate + Rekor entry in one JSON
          # file). The legacy `--output-signature`/`--output-certificate`
          # flags are silently ignored under cosign's default new-bundle
          # format — cosign then fails trying to open an empty bundle path
          # — so they must not be used.
          shopt -s nullglob
          for dir in artifacts/latticearc-*/; do
            for file in "$dir"liblatticearc*; do
              if [ -f "$file" ] && [[ ! "$file" =~ \.bundle$ ]]; then
                echo "Signing: $file"
                cosign sign-blob --yes \
                  --bundle "${file}.bundle" \
                  "$file"
              fi
            done
          done

          # Sign SBOM (required, not best-effort).
          # Refuse to sign a placeholder SBOM: the generation step has
          # `continue-on-error: true` and an `|| echo '{}' > sbom.cdx.json`
          # fallback. Signing whatever is on disk would let an empty `{}`
          # ship as a Sigstore-attested SBOM if cargo-sbom/cargo-cyclonedx
          # ever fails to install or run. Validate non-empty CycloneDX
          # contents (must have a non-empty `components` array) before
          # cosign sees the file.
          SBOM_PATH="artifacts/sbom/sbom.cdx.json"
          if [ ! -f "$SBOM_PATH" ]; then
            echo "ERROR: SBOM artifact missing; release cannot ship unsigned."
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "ERROR: jq required to validate SBOM before signing"
            exit 1
          fi
          if ! jq -e '(.components | type == "array" and length > 0)' "$SBOM_PATH" >/dev/null; then
            echo "ERROR: SBOM at $SBOM_PATH is empty or missing components;"
            echo "       refusing to attach a Sigstore signature to a placeholder."
            exit 1
          fi
          echo "Signing SBOM..."
          cosign sign-blob --yes \
            --bundle "${SBOM_PATH}.bundle" \
            "$SBOM_PATH"

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: |
            artifacts/**/*.bundle
          # error if signatures are missing.
          # `warn` previously masked the unsigned-release failure mode.
          if-no-files-found: error

  # Attach artifacts to release
  attach-release-artifacts:
    name: Attach Release Artifacts
    needs: [release, sbom, sign-artifacts, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts/

      - name: Remove empty files (GitHub rejects 0-byte uploads)
        run: find release-artifacts/ -type f -empty -delete

      - name: Attach to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          files: |
            release-artifacts/sbom/*
            release-artifacts/signatures/*
            release-artifacts/latticearc-*/*.tar.gz
            release-artifacts/latticearc-*/*.txt
            release-artifacts/latticearc-*/liblatticearc*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release summary
  release-summary:
    name: Release Summary
    needs: [verify, publish, release, sbom, provenance, sign-artifacts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "# Release Summary: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verification | ${{ needs.verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Publish | ${{ needs.publish.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA Provenance | ${{ needs.provenance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sigstore Signing | ${{ needs.sign-artifacts.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Supply Chain Security" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This release includes:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SLSA Level 3 build provenance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Sigstore keyless signatures" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CycloneDX SBOM" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SPDX SBOM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To verify artifact signatures:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign verify-blob \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  --bundle artifact.bundle \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp 'https://github.com/.*' \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\\\" >> $GITHUB_STEP_SUMMARY
          echo "  artifact" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
