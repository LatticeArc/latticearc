name: Security Scan

on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

    - name: Install cargo-audit
      # Pinned: see ci.yml security-tools install rationale. Uses
      # taiki-e/install-action (prebuilt binaries) for consistency with
      # the cargo-llvm-cov install pattern.
      uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # main
      with:
        tool: cargo-audit@0.22.1

    - name: Run security audit
      run: |
        # single source of truth is
        # `.cargo/audit.toml`; CLI flags removed.
        cargo audit --deny warnings

    - name: Install cargo-deny
      # Pinned: same rationale as cargo-audit above.
      uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # main
      with:
        tool: cargo-deny@0.19.6

    - name: Check dependencies
      run: |
        
        cargo deny check all

  clippy-security:
    name: Clippy Security Lints
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      with:
        components: clippy

    - name: Cache Cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-security-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run security-focused clippy
      run: |
        
        cargo clippy --workspace --all-targets --all-features -- \
          -D clippy::all \
          -D clippy::perf \
          -D clippy::style \
          -D clippy::complexity \
          -D clippy::correctness \
          -D clippy::suspicious \
          -D warnings

  memory-safety:
    name: Memory Safety Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      with:
        components: clippy

    - name: Install Valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind

    - name: Cache Cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-memory-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build with debug symbols (valgrind profile)
      env:
        RUST_MIN_STACK: 16777216
      run: |
        cargo test --workspace --all-features --profile valgrind --no-run

    - name: Run Valgrind memory check
      env:
        RUST_MIN_STACK: 16777216
      run: |
        TEST_BIN=$(find target/valgrind/deps -name 'latticearc-*' -type f -executable ! -name '*.d' | head -1)
        if [ -z "$TEST_BIN" ]; then
          echo "No test binary found"
          exit 1
        fi
        echo "Running Valgrind on: $TEST_BIN"
        valgrind \
          --leak-check=full \
          --show-leak-kinds=all \
          --errors-for-leak-kinds=definite,indirect \
          --suppressions=.valgrind/rust-test.supp \
          --error-exitcode=1 \
          "$TEST_BIN" --test-threads=1

  side-channel-analysis:
    name: Side Channel Analysis
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

    - name: Install timing analysis tools
      run: sudo apt-get update && sudo apt-get install -y time

    - name: Cache Cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-sidechannel-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run timing analysis tests
      run: |
        cargo test timing --workspace --all-features --release

    - name: Run side-channel resistance tests
      run: |
        cargo test constant_time --workspace --all-features --release

  cryptographic-tests:
    name: Cryptographic Security Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

    - name: Cache Cargo registry
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-crypto-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Run NIST KAT compliance tests
      run: cargo test --package latticearc-tests --test nist_kat_runner --all-features --release

    - name: Run cryptographic validation tests
      run: cargo test --package latticearc-tests --all-features --release

    - name: Run hybrid encryption tests
      run: cargo test --package latticearc --all-features --release

    - name: Run zeroization tests
      run: cargo test --workspace --all-features --release -- zeroization

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

    - name: Install cargo-outdated
      # --locked uses cargo-outdated's own Cargo.lock so transitive deps
      # (e.g. constant_time_eq) can't drift past our MSRV (1.93).
      run: cargo install cargo-outdated --locked

    - name: Check for outdated dependencies
      continue-on-error: true
      run: |
        # Report outdated dependencies but don't fail the build
        cargo outdated --workspace || true

    - name: Install cargo-tree
      run: cargo install cargo-tree --locked

    - name: Generate dependency tree
      run: |
        
        cargo tree --workspace --all-features > dependency_tree.txt

    - name: Upload dependency tree
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dependency-tree
        path: dependency_tree.txt
        retention-days: 30

  secret-type-invariants:
    name: Secret-Type Invariants
    runs-on: ubuntu-latest
    # No Rust toolchain needed — pure bash/awk/grep gate over source text.
    # Documented at docs/SECRET_TYPE_INVARIANTS.md; previously documented
    # as a CI gate but unwired (audit finding L-NEW-1).
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Self-test the audit (M-NEW-1 regression guard)
      # Plant synthetic I-1 and I-4 file-wide-grep reproducers and confirm
      # the gate catches them. If the gate ever regresses to file-wide
      # grep, this step fails before the live audit runs.
      run: bash scripts/ci/secret_type_audit.sh --self-test

    - name: Audit live source tree
      run: bash scripts/ci/secret_type_audit.sh

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [security-audit, clippy-security, memory-safety, side-channel-analysis, cryptographic-tests, dependency-scan, secret-type-invariants]
    if: always()
    env:
      SECURITY_AUDIT_RESULT: ${{ needs.security-audit.result }}
      CLIPPY_SECURITY_RESULT: ${{ needs.clippy-security.result }}
      MEMORY_SAFETY_RESULT: ${{ needs.memory-safety.result }}
      SIDE_CHANNEL_RESULT: ${{ needs.side-channel-analysis.result }}
      CRYPTO_TESTS_RESULT: ${{ needs.cryptographic-tests.result }}
      DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
      SECRET_TYPE_RESULT: ${{ needs.secret-type-invariants.result }}
    steps:
    - name: Generate security summary
      run: |
        {
          echo "# Security Scan Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Security Audit | $SECURITY_AUDIT_RESULT |"
          echo "| Clippy Security | $CLIPPY_SECURITY_RESULT |"
          echo "| Memory Safety | $MEMORY_SAFETY_RESULT |"
          echo "| Side Channel Analysis | $SIDE_CHANNEL_RESULT |"
          echo "| Cryptographic Tests | $CRYPTO_TESTS_RESULT |"
          echo "| Dependency Scan | $DEPENDENCY_SCAN_RESULT |"
          echo "| Secret-Type Invariants | $SECRET_TYPE_RESULT |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Check overall status
      run: |
        if [[ "$SECURITY_AUDIT_RESULT" == "failure" || \
              "$CLIPPY_SECURITY_RESULT" == "failure" || \
              "$MEMORY_SAFETY_RESULT" == "failure" || \
              "$SIDE_CHANNEL_RESULT" == "failure" || \
              "$CRYPTO_TESTS_RESULT" == "failure" || \
              "$DEPENDENCY_SCAN_RESULT" == "failure" || \
              "$SECRET_TYPE_RESULT" == "failure" ]]; then
          echo "❌ Security scan failed!"
          exit 1
        else
          echo "✅ All security checks passed!"
        fi