# CodeQL Security Analysis
# GitHub's semantic code analysis for security vulnerabilities

name: CodeQL

on:
  push:
    # previously CodeQL only ran on PRs and the
    # weekly schedule. Direct pushes to main (squash-merged Dependabot
    # PRs, hotfixes that bypass review, admin-bypass merges of audit
    # rounds) went unanalysed for up to a week.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-codeql-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: rust
          queries: security-extended,security-and-quality
        env:
          CODEQL_ENABLE_EXPERIMENTAL_FEATURES: true

      - name: Build for CodeQL analysis
        run: cargo build --workspace --all-features

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:rust"
